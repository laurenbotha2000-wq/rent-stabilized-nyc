[package]
name = "reasier-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2", "query", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }


[lib]
name = "reasier"
path = "src/lib.rs"

[[bin]]
name = "reasier-server"
path = "src/main.rs"
