# Every 5 minutes (GitHub's minimum): sync Reasier, geocode new addresses,
# add HPD building records, and publish changes plus change events (new,
# price_change, delisted, relisted) to Firestore.
#
# This is the fallback runner: when the always-on server
# (scripts/install-server-poller.sh) or the Mac poller (scripts/poll-mac.sh)
# has checked within the last 4 minutes, it stands down. Every run starts from the
# published copy in Firestore, so runners never drift apart, and publishing is
# transactional, so two runners can't record the same change twice.
# Secrets: FIREBASE_SERVICE_ACCOUNT (JSON key).
name: sync
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if another runner checked recently"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write   # monthly keepalive commit (GitHub pauses idle schedules after 60 days)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-audit --no-fund --silent
      - id: fresh
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/fresh.mjs | tee /dev/stderr | grep '^skip=' | tail -1 >> "$GITHUB_OUTPUT"

  sync:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The server binary is rebuilt only when its source changes.
      - id: bin
        uses: actions/cache@v4
        with:
          path: bin/reasier-server
          key: bin-${{ runner.os }}-${{ hashFiles('server-rs/**', 'Cargo.lock', 'ui/**') }}
      - if: steps.bin.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.bin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.bin.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --release --locked -p reasier-server
          mkdir -p bin && cp target/release/reasier-server bin/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-audit --no-fund --silent

      - name: Sync, add HPD records, publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BIN: bin/reasier-server
          SYNC_RUNNER: github
        run: scripts/sync.sh

      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .github/keepalive
            git add .github/keepalive && git commit -m "keepalive" && git push
          fi
