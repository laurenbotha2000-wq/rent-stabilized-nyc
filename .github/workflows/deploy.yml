# Deploy the website and Firestore security rules whenever they change.
# Secrets: FIREBASE_SERVICE_ACCOUNT. Variables: FIREBASE_PROJECT_ID.
name: deploy
# Manual for now (Actions → deploy → Run workflow). Switch to `push` once the
# service account has the Firebase Hosting Admin and Firebase Rules Admin roles.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-audit --no-fund --silent
      - name: Deploy hosting and rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
